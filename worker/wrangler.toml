# ─────────────────────────────────────────────────────────────────────────
# Trendy Choice API — wrangler.toml
# ⚠️ এই ফাইলে কোনো API key লেখা নেই। শুধু secret-এর নাম আছে।
#    key বসাতে হবে Cloudflare Dashboard → Settings → Variables and Secrets
#    (অথবা টার্মিনালে: wrangler secret put API_KEY_1)
# ─────────────────────────────────────────────────────────────────────────

name = "trendy"
main = "worker.js"
compatibility_date = "2024-11-01"

# ── সাধারণ ভেরিয়েবল (secret নয়, পাবলিক) ──
[vars]
# CORS: এই origin ছাড়া আর কোথাও API খোলে না
ALLOWED_ORIGIN = "https://r4yh4n-dev.github.io"
# লোকাল টেস্ট করতে চাইলে true করুন (ডিপ্লয়ে false রাখুন)
ALLOW_LOCALHOST = "false"
# cache কত সেকেন্ড
CACHE_TTL_SECONDS = "60"

# ── সোর্স API (ঐচ্ছিক — না দিলে কোডের ডিফল্ট ব্যবহার হবে) ──
# আপনার দুইটা সোর্সের আসল endpoint এখানে বসান:
SOURCE_1_URL = "https://api.businesskoro.com/api/v1/storefront/products"
SOURCE_2_URL = "https://dropbazarbd.com/api/products"

# ── KV binding (অর্ডার সেভ করার জন্য) ──
# আগে KV namespace বানাতে হবে:
#   wrangler kv namespace create ORDERS
# তারপর নিচের id বসিয়ে কমেন্ট খুলে দিন।
# KV না থাকলেও Worker চলবে — অর্ডার শুধু লগ হবে, রেসপন্স সফল আসবে।
#
[[kv_namespaces]]
binding = "ORDERS"
id = "06bc103fcd1c4085b0b8a0506ee22de5"

# ── Secrets (এগুলো wrangler.toml-এ লিখবেন না!) ──
# API_KEY_1  →  wrangler secret put API_KEY_1
# API_KEY_2  →  wrangler secret put API_KEY_2
